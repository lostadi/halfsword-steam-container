# macOS TRY-ONLY compose for dockur/windows
# This will let the container START on macOS Docker Desktop (no real KVM).
# WARNING: It will be EXTREMELY SLOW (software emulation, basically 1 core).
# Fine for testing the setup or light tasks.
# DO NOT expect to play Half Sword at playable FPS. Use GeForce NOW, Whisky, or CrossOver instead.

services:
  windows:
    image: dockurr/windows
    container_name: halfsword-windows-macos-try
    environment:
      VERSION: "11"
      # With your M1 Max + 64GB unified RAM you can be generous here,
      # but remember: this is still heavily emulated (Docker Linux VM + QEMU on Apple Silicon).
      # Expect it to feel slow for a physics game like Half Sword.
      RAM_SIZE: "16G"
      CPU_CORES: "6"
      DISK_SIZE: "120G"
      USERNAME: "Docker"
      PASSWORD: "admin"
      KVM: "N"                # THE KEY: disable KVM acceleration (required on macOS)
      # You can also try BOOT_MODE if needed, but default is usually fine
    # Do NOT include /dev/kvm device on macOS
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./windows-macos:/storage   # Separate folder so it doesn't conflict with normal one
      - ./shared:/shared
      - ./oem:/oem
    restart: unless-stopped
    stop_grace_period: 2m
